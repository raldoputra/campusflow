<title>CampusFlow — Cosmic Edition</title>
<style>
:root{--bg:#080d1d;--panel:rgba(19,27,52,.78);--panel2:#111b35;--line:rgba(164,183,255,.13);--text:#edf1ff;--muted:#8e9bbb;--purple:#8b72ff;--blue:#4ca8ff;--cyan:#54e0e0;--green:#55dfb0}

main{padding:27px clamp(18px,3vw,42px) 40px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.eyebrow{color:#9b8cff;font-size:11px;letter-spacing:1.8px;text-transform:uppercase}.topbar h1{font-size:25px;margin:3px 0 0;letter-spacing:-.7px}.top-actions{display:flex;align-items:center;gap:10px}.date-pill,.icon-btn{border:1px solid var(--line);background:#121b35;color:#c7d2f1;border-radius:11px;padding:10px 13px}.icon-btn{cursor:pointer;font-size:16px}.hero{position:relative;overflow:hidden;border:1px solid #8c7bff35;border-radius:22px;padding:27px 30px;background:linear-gradient(110deg,#27205bdb,#142b50d9 68%,#143b51c9);box-shadow:0 18px 60px #0003;margin-bottom:21px}.hero:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:8%;top:-115px;border:1px solid #9a9cff33;box-shadow:0 0 0 25px #9a9cff0b,0 0 0 55px #9a9cff08,0 0 70px #7c70ff55}.hero-content{position:relative;z-index:1;max-width:600px}.hero h2{font-size:25px;margin:8px 0}.hero p{color:#c2c9e6;margin:0 0 18px;max-width:510px}.primary{background:linear-gradient(100deg,#8b70ff,#4a9cff);color:white;border:0;border-radius:10px;padding:10px 15px;font-weight:650;cursor:pointer;box-shadow:0 7px 22px #6d68ff44}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:21px}.stat,.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:17px}.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin:8px 0 1px}.trend{font-size:11px;color:var(--green)}.stat-icon{width:31px;height:31px;display:grid;place-items:center;background:#8171ff22;border-radius:10px}.content-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:17px}.panel{padding:19px;margin-bottom:17px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.panel h3{margin:0;font-size:15px}.muted{color:var(--muted)}.text-btn{background:none;border:0;color:#a99bff;cursor:pointer;font:inherit;font-size:12px}.task-list{display:grid;gap:9px}.task{display:flex;align-items:flex-start;gap:11px;padding:12px;border:1px solid #a9b8ed13;background:#101a34a8;border-radius:12px}.task input{accent-color:#947aff;margin-top:4px;width:16px;height:16px}.task-info{flex:1;min-width:0}.task-info b{display:block;font-size:13px}.task-info small{color:var(--muted);font-size:11px}.task.done b{text-decoration:line-through;color:#71809e}.tag{font-size:10px;padding:4px 8px;border-radius:20px;background:#7564ff24;color:#c5baff;white-space:nowrap}.tag.blue{background:#3a9dff20;color:#8ccaff}.tag.green{background:#36d9a31b;color:#78e7c1}.tag.orange{background:#f5a64b1b;color:#ffc27b}.progress-wrap{margin-top:14px}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:7px}.progress{height:7px;background:#293454;border-radius:10px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,#8d70ff,#49c6e9);border-radius:10px}.course-list{display:grid;gap:12px}.course{display:flex;align-items:center;gap:10px}.course-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#7668ff25;color:#c8bcff}.course-info{flex:1}.course-info b{display:block;font-size:12px}.course-info small{color:var(--muted);font-size:10px}.course-count{font-size:11px;color:#b4c1e3}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);border-radius:10px;text-align:center;padding:9px 2px;background:#101a33}.day small{display:block;color:var(--muted);font-size:9px}.day b{font-size:13px}.day.has{border-color:#8d7aff88;background:#7564ff20}.day.today{background:linear-gradient(145deg,#7967ed,#387fc3);border-color:transparent}.day.today small{color:#e7e8ff}.deadline{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.deadline:last-child{border:0}.datebox{width:40px;height:42px;border-radius:10px;background:#7465ff22;display:grid;place-items:center;color:#c8bdff;font-weight:700}.deadline b{font-size:12px;display:block}.deadline small{color:var(--muted);font-size:10px}.page{display:none}.page.active{display:block}.empty{color:var(--muted);padding:25px;text-align:center}.modal-backdrop{display:none;position:fixed;inset:0;background:#030713b9;backdrop-filter:blur(8px);z-index:5;place-items:center;padding:18px}.modal-backdrop.show{display:grid}.modal{width:min(430px,100%);background:#121c38;border:1px solid var(--line);border-radius:18px;padding:22px}.modal h3{margin:0 0 15px}.field{display:grid;gap:6px;margin:11px 0}.field label{color:var(--muted);font-size:11px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);background:#0b142b;color:white;border-radius:9px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.secondary{border:1px solid var(--line);background:transparent;color:#c5cfea;border-radius:9px;padding:9px 13px;cursor:pointer}.mobile-nav{display:none}
@media(max-width:900px){.app{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}}
@media(max-width:650px){.app{display:block}.sidebar{display:none}main{padding:19px 14px 90px}.topbar h1{font-size:21px}.date-pill{display:none}.hero{padding:22px 19px}.hero h2{font-size:21px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.panel{padding:15px}.mobile-nav{display:flex;position:fixed;z-index:4;bottom:10px;left:10px;right:10px;justify-content:space-around;padding:9px 5px;background:#111a33ed;border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px)}.mobile-nav button{border:0;background:none;color:#91a0c1;font-size:10px;display:grid;gap:3px;justify-items:center}.mobile-nav button.active{color:#b6a8ff}.mobile-nav span{font-size:17px}}

/* ===== v2 additions ===== */
html{-webkit-text-size-adjust:100%}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:0}
.avatar{overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.profile-mini{cursor:pointer;transition:.2s}.profile-mini:hover{border-color:#8c7bff66}
.top-avatar{width:40px;height:40px;border-radius:50%;padding:0;overflow:hidden;border:2px solid #8c7bff66;background:#121b35;cursor:pointer;box-shadow:0 0 18px #7c68ff44}
.top-avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
button{font-family:inherit}
.tag.red{background:#ff5d6c22;color:#ff9aa4}
.tag.purple{background:#7564ff24;color:#c5baff}
.mini{background:none;border:0;color:#8e9bbb;cursor:pointer;padding:3px 6px;border-radius:7px;font-size:13px}
.mini:hover{background:#7564ff2a;color:white}
.task{align-items:center}
.task-side{display:grid;gap:4px;justify-items:end}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.acts{display:flex;gap:2px}
.hero-chip{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;padding:7px 12px;border-radius:30px;background:#ffffff14;border:1px solid #ffffff1c;font-size:12px;color:#dfe5ff}
.hero-chip i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.panel.warn{border-color:#f5a64b66;background:linear-gradient(120deg,#3a2a1a88,var(--panel))}
.reminder{display:grid;gap:7px}
.reminder .r{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select,.inp,textarea.inp{padding:9px 11px;border:1px solid var(--line);background:#0b142b;color:white;border-radius:9px;font:inherit;font-size:13px;max-width:100%}
.toolbar input{flex:1;min-width:140px}
textarea.inp{width:100%;resize:vertical;line-height:1.6}
.field textarea{width:100%;padding:11px;border:1px solid var(--line);background:#0b142b;color:white;border-radius:9px;font:inherit}
.seg{display:inline-flex;background:#0b142b;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:#9eabc8;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.seg button.on{background:linear-gradient(100deg,#8b70ff,#4a9cff);color:white}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:#101a33;color:#b9c5e6;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.chip.on{border-color:#8d7aff;background:#7564ff30;color:white}
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-nav h3{min-width:150px}
.cal-week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.cal-day{border:1px solid var(--line);border-radius:13px;background:#0f1932;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.cal-day.today{border-color:#8d7aff;box-shadow:0 0 0 1px #8d7aff55 inset}
.cal-day header{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}
.cal-day header b{color:var(--text);font-size:15px}
.ev{font-size:11px;padding:6px 8px;border-radius:8px;line-height:1.35;text-align:left;border:0;width:100%;cursor:default;color:var(--text)}
.ev small{display:block;color:#9fb0d6;font-size:10px}
.ev.cls{background:#4ca8ff1c;border-left:3px solid var(--blue)}
.ev.tsk{background:#f5a64b1a;border-left:3px solid #f5a64b;cursor:pointer}
.ev.tsk.done{background:#36d9a315;border-left-color:var(--green);text-decoration:line-through;color:#7d8cab}
.cal-empty{color:#56648a;font-size:11px;margin:auto}
.month-head,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.month-head div{text-align:center;color:var(--muted);font-size:10px;letter-spacing:1px;padding:4px 0}
.cell{border:1px solid var(--line);background:#101a33;color:var(--text);border-radius:10px;padding:7px 4px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px}
.cell.out{opacity:.38}
.cell.today{background:linear-gradient(145deg,#7967ed,#387fc3);border-color:transparent}
.cell.sel{outline:2px solid #b6a8ff}
.dots{display:flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots .c{background:var(--blue)}.dots .o{background:#f5a64b}.dots .g{background:var(--green)}
.detail-h{margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.detail-h h3{font-size:14px}
.sch-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}
.sch-col h4{margin:0 0 9px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#9b8cff;display:flex;gap:8px;align-items:center}
.sch-card{border:1px solid var(--line);background:#101a34;border-radius:13px;padding:12px;margin-bottom:9px;border-left:3px solid var(--purple)}
.sch-card.now{border-color:var(--green);box-shadow:0 0 22px #55dfb022;border-left-color:var(--green)}
.sch-card .tm{font-size:11px;color:var(--cyan);font-weight:650}
.sch-card b{display:block;font-size:13px;margin:3px 0}
.sch-card small{display:block;color:var(--muted);font-size:11px;line-height:1.45}
.sum-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.sum{border:1px solid var(--line);background:#101a34;border-radius:12px;padding:10px 14px;font-size:11px;color:var(--muted)}
.sum b{display:block;font-size:19px;color:var(--text)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.ccard{border:1px solid var(--line);background:#101a34;border-radius:15px;padding:15px;display:grid;gap:9px;align-content:start}
.ccard h4{margin:0;font-size:14px}
.ccard .code{font-size:10px;color:#9b8cff;letter-spacing:1px}
.ccard ul{margin:0;padding-left:16px;color:#aebbdc;font-size:12px}
.ccard .row{display:flex;gap:6px;flex-wrap:wrap}
.notes-wrap{display:grid;grid-template-columns:230px 1fr;gap:15px}
.note-list{display:grid;gap:6px;align-content:start}
.note-list button{border:1px solid var(--line);background:#101a34;color:#b9c5e6;text-align:left;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:8px}
.note-list button.on{border-color:#8d7aff;background:#7564ff24;color:white}
.note-list i{width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:5px;flex:none}
.ring-box{position:relative;width:230px;height:230px;margin:14px auto}
.ring-box svg{width:100%;height:100%}
.ring-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
#timer{font-size:48px;font-weight:750;letter-spacing:1px;line-height:1.1}
.study-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:17px}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi div{border:1px solid var(--line);background:#101a34;border-radius:12px;padding:11px 13px;font-size:11px;color:var(--muted)}
.kpi b{display:block;font-size:20px;color:var(--text)}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:6px}
.bars div{flex:1;display:grid;gap:5px;justify-items:center;align-content:end;height:100%;font-size:9px;color:var(--muted)}
.bars span{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#8d70ff,#49c6e9);min-height:3px;display:block}
.id-card{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.idphoto{width:160px;aspect-ratio:10/11;border-radius:16px;object-fit:cover;object-position:50% 15%;border:2px solid #8c7bff55;box-shadow:0 0 34px #7c68ff44;display:block}
.id-data{flex:1;min-width:230px}
.id-data h2{margin:2px 0 4px;font-size:22px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;margin-top:14px;font-size:13px}
.kv span{color:var(--muted)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.danger{border:1px solid #ff5d6c55;background:#ff5d6c14;color:#ff9aa4;border-radius:9px;padding:9px 13px;cursor:pointer}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border:0}
.set-row p{margin:2px 0 0;font-size:12px;color:var(--muted);max-width:480px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:20;background:#1a2547;border:1px solid #8c7bff66;color:white;padding:10px 14px;border-radius:12px;font-size:13px;display:none;gap:12px;align-items:center;box-shadow:0 12px 40px #0008;max-width:92vw}
.toast.show{display:flex}
.toast button{background:none;border:0;color:#b6a8ff;font-weight:650;cursor:pointer}
.modal-backdrop.sheet-bd{place-items:end center;padding:0}
.sheet{width:min(520px,100%);background:#121c38;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px 26px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.sheet-grid button{border:1px solid var(--line);background:#0f1932;color:#c5cfea;border-radius:13px;padding:13px 4px;display:grid;gap:5px;justify-items:center;font-size:11px;cursor:pointer}
.sheet-grid button.active{border-color:#8d7aff;color:white;background:#7564ff26}
.sheet-grid span{font-size:19px}
.file-actions{display:flex;gap:2px}
.mobile-nav button{cursor:pointer}
@media(max-width:900px){.study-grid{grid-template-columns:1fr}.sch-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.notes-wrap{grid-template-columns:1fr}.note-list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media(max-width:650px){.cal-week{grid-template-columns:1fr}.cal-day{min-height:0}.kv{grid-template-columns:105px 1fr}.idphoto{width:130px}.toast{bottom:92px}.cell{min-height:50px;font-size:12px}.cal-nav h3{min-width:0}.set-row{flex-direction:column;align-items:flex-start}.task-side{justify-items:end}.ring-box{width:200px;height:200px}#timer{font-size:40px}}
.deadline .tag{align-self:center;height:fit-content;flex:none}
/* ===== game ===== */
.game-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#050914}
.game-wrap canvas{display:block;width:100%;height:clamp(420px,calc(100vh - 250px),680px);touch-action:none;cursor:crosshair}
.g-hud{position:absolute;pointer-events:none;font-size:12px;color:#dfe6ff;text-shadow:0 1px 3px #000a}
.g-left{left:12px;top:10px}.g-big{font-size:28px;font-weight:750;line-height:1.1}
.g-right{right:10px;top:10px;min-width:150px;background:#0a1230aa;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.g-right div{display:flex;justify-content:space-between;gap:10px}.g-right .me{color:#8ff0d0;font-weight:700}
.g-over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,9,20,.72);backdrop-filter:blur(5px);padding:14px;overflow:auto}.g-over.hide{display:none}
.g-card{width:min(420px,100%);text-align:center;display:grid;gap:12px;padding:20px;border:1px solid #8c7bff44;border-radius:20px;background:#0f1836ee;box-shadow:0 20px 60px #0008}
.g-card h2{margin:0;font-size:28px;background:linear-gradient(100deg,#9b70ff,#54e0e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-help{font-size:11px;color:var(--muted);line-height:1.8}
.g-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g-stats div{border:1px solid var(--line);border-radius:12px;padding:9px;font-size:11px;color:var(--muted)}.g-stats b{display:block;font-size:20px;color:#fff}
.g-card .inp{text-align:center;font-size:15px}
.joy{position:absolute;left:16px;bottom:16px;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,rgba(124,104,255,.10) 0,rgba(124,104,255,.22) 100%);border:2px solid rgba(255,255,255,.32);box-shadow:0 0 22px #7c68ff55,inset 0 0 18px #7c68ff33;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}

const DAYMS=864e5,pad=n=>String(n).padStart(2,"0");
const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"],HARI3=["MIN","SEN","SEL","RAB","KAM","JUM","SAB"];
const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"],BULAN3=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const diff=s=>Math.round((parse(s)-today())/DAYMS);
const fmt=s=>{const d=parse(s);return d.getDate()+" "+BULAN3[d.getMonth()]};
const fmtLong=d=>d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear();
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const weekStart=()=>{const t=today();return t.getDay()===0?addDays(t,1):mondayOf(t)};
const fmtRange=ws=>{const e=addDays(ws,6);return ws.getMonth()===e.getMonth()?ws.getDate()+"–"+e.getDate()+" "+BULAN[ws.getMonth()]+" "+ws.getFullYear():ws.getDate()+" "+BULAN3[ws.getMonth()]+" – "+e.getDate()+" "+BULAN3[e.getMonth()]+" "+e.getFullYear()};
const fmtMin=m=>m>=60?Math.floor(m/60)+"j "+(m%60)+"m":m+"m";
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const classesOn=d=>COURSES.filter(c=>c.day===d.getDay()).sort((a,b)=>toMin(a.start)-toMin(b.start));
const PR={High:0,Medium:1,Low:2},prCls=p=>p==="High"?"orange":p==="Low"?"green":"blue";

/* ================= CALENDAR ================= */
const C={mode:"week",week:weekStart(),month:new Date(today().getFullYear(),today().getMonth(),1),sel:iso(today())};
function calGoto(k){const d=parse(k);C.sel=k;C.week=mondayOf(d);C.month=new Date(d.getFullYear(),d.getMonth(),1);showPage("calendar")}
function calMove(n){if(C.mode==="week")C.week=addDays(C.week,7*n);else C.month=new Date(C.month.getFullYear(),C.month.getMonth()+n,1);renderCalendar()}
function calToday(){C.week=weekStart();C.month=new Date(today().getFullYear(),today().getMonth(),1);C.sel=iso(today());renderCalendar()}
function calMode(m){C.mode=m;renderCalendar()}
function calSel(k){C.sel=k;renderCalendar()}
function evCls(c){return`<div class="ev cls"><b>${c.start}–${c.end}</b> ${esc(c.short)}<small>${esc(c.room)}</small></div>`}
function evTask(t){return`<button class="ev tsk ${t.done?"done":""}" onclick="openTask('${t.id}')">${t.done?"✓":"◻"} ${esc(t.title)}<small>${esc(cb(t.courseId).short)}</small></button>`}
function renderCalendar(){
 const t0=iso(today());let title,body;
 if(C.mode==="week"){title=fmtRange(C.week);
  body=`<div class="cal-week">`+Array.from({length:7},(_,i)=>{const d=addDays(C.week,i),k=iso(d),cl=classesOn(d),tk=sortTasks(S.tasks.filter(t=>t.date===k));
   return`<div class="cal-day ${k===t0?"today":""}"><header><span>${HARI[d.getDay()].toUpperCase()} <b>${d.getDate()}</b></span><button class="mini" title="Tambah tugas" onclick="openTask(null,'','${k}')">＋</button></header>${cl.map(evCls).join("")}${tk.map(evTask).join("")}${cl.length||tk.length?"":'<div class="cal-empty">Kosong</div>'}</div>`}).join("")+`</div>`}

function tick(){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));updateTimerUI();if(T.left<=0)finishTimer()}
function beep(){try{if(!ac)return;[0,.28,.56].forEach(o=>{const x=ac.createOscillator(),g=ac.createGain();x.frequency.value=880;g.gain.value=.15;x.connect(g);g.connect(ac.destination);x.start(ac.currentTime+o);x.stop(ac.currentTime+o+.18)})}catch(e){}}

function idb(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error("no"));const r=indexedDB.open("campusflow-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("f",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fileOp(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction("f",mode),rq=fn(tx.objectStore("f"));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
let fileCourse="";
function renderFiles(){
 $("p-files").innerHTML=`<div class="panel"><div class="panel-head"><h3>▱ My Files</h3></div><p class="muted">Dokumen disimpan di browser perangkat ini (tidak diunggah ke server), jadi tetap ada saat offline. Ekspor cadangan data tidak mencakup berkas.</p>
 <div class="toolbar"><select onchange="fileCourse=this.value"><option value="">Tanpa mata kuliah</option>${COURSES.map(c=>`<option value="${c.id}" ${fileCourse===c.id?"selected":""}>${esc(c.short)}</option>`).join("")}</select><input type="file" id="fileInput" multiple style="color:#cbd5f2;flex:2" onchange="addFiles(this)"></div>
 <div id="fileList" class="task-list" style="margin-top:15px"><div class="empty">Memuat…</div></div></div>`;loadFiles()}
async function addFiles(inp){const fs=[...inp.files];if(!fs.length)return;try{for(const f of fs)await fileOp("readwrite",st=>st.put({id:"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:f.name,size:f.size,type:f.type,added:Date.now(),courseId:fileCourse,blob:f}));toast(fs.length+" berkas disimpan")}catch(e){toast("Gagal menyimpan berkas (penyimpanan browser tidak tersedia)")}inp.value="";loadFiles()}
async function loadFiles(){const box=$("fileList");if(!box)return;try{const a=(await fileOp("readonly",st=>st.getAll())||[]).sort((x,y)=>y.added-x.added);
 box.innerHTML=a.length?a.map(f=>`<div class="task"><span style="font-size:18px">▱</span><div class="task-info"><b>${esc(f.name)}</b><small>${(f.size/1024).toFixed(1)} KB · ${fmt(iso(new Date(f.added)))}${f.courseId?" · "+esc(cb(f.courseId).short):""}</small></div><div class="file-actions"><button class="mini" onclick="dlFile('${f.id}')">⬇</button><button class="mini" onclick="rmFile('${f.id}')">🗑</button></div></div>`).join(""):'<div class="empty">Belum ada berkas. Pilih file di atas untuk menyimpannya.</div>'}catch(e){box.innerHTML='<div class="empty">Penyimpanan berkas tidak tersedia di browser ini.</div>'}}
async function dlFile(id){try{const f=await fileOp("readonly",st=>st.get(id));const u=URL.createObjectURL(f.blob),a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){toast("Gagal membuka berkas")}}
async function rmFile(id){if(!confirm("Hapus berkas ini dari perangkat?"))return;try{await fileOp("readwrite",st=>st.delete(id))}catch(e){}loadFiles()}
